# Production overlay for a VPS. Use it explicitly — passing -f also skips
# docker-compose.override.yml, which is for local development only:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (80 + HTTPS_PORT, 443 by default;
# HTTPS via Let's Encrypt);
# the API is served under https://$DOMAIN/api through the mini-app's nginx.

services:
  web:
    ports: !reset []

  miniapp:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: hackaton_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=maxnalog.ru}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - miniapp

  # --- Real programs from official portals ---------------------------------
  # The collector runs always. Sources behind Russian geo-blocking need the
  # tunnel: enable it with COMPOSE_PROFILES=ru-tunnel, RU_SSH_HOST and
  # COLLECTOR_PROXY=socks5://ru-tunnel:1080 in .env, once the Russian VPS
  # accepts deploy/ru_tunnel_key.
  ru-tunnel:
    build: ./deploy/ru-tunnel
    container_name: hackaton_ru_tunnel
    restart: unless-stopped
    profiles: ["ru-tunnel"]
    environment:
      RU_SSH_HOST: ${RU_SSH_HOST:-}
      RU_SSH_USER: ${RU_SSH_USER:-root}
      RU_SSH_PORT: ${RU_SSH_PORT:-22}
    volumes:
      - ./deploy/ru_tunnel_key:/run/ru_tunnel_key:ro

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackaton_collector
    restart: unless-stopped
    command: python -m app.collector --loop
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackaton_db}
    depends_on:
      web:
        condition: service_healthy
      ru-tunnel:
        condition: service_started
        required: false

volumes:
  caddy_data:
  caddy_config:
