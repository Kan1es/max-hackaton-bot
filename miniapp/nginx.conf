server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve `web` through Docker's DNS on every request instead of once at
    # startup. With a literal hostname in proxy_pass nginx pins the IP it saw
    # when it started, so recreating the backend container (a deploy) left
    # every /api call returning 502 until the mini-app was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://web:8000;

    # Same-origin proxy to the FastAPI service. The mini-app calls /api/v1/...
    # on its own host, so the browser never performs a cross-origin request
    # and MAX never sees mixed content behind an HTTPS terminator.
    location /api/ {
        # With a variable and no URI part, nginx forwards the original
        # /api/... path unchanged — the same mapping as before.
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass $backend;
    }

    # Hashed build assets never change content under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
