# Local development overrides, applied automatically by `docker compose up`.
# Not for deployment: it mounts the source tree, enables hot reload, exposes
# Postgres on the host and lets unsigned requests through to the API.

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  web:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    environment:
      # Lets Swagger and curl identify with a plain X-Max-User-Id header
      # instead of a signed mini-app initData string.
      - REQUIRE_SIGNED_INIT_DATA=False

  bot:
    volumes:
      - ./bot:/app/bot

  miniapp:
    build:
      args:
        # Vite inlines this at build time; empty means "same origin", which is
        # what the nginx /api proxy provides.
        VITE_API_BASE_URL: ""
