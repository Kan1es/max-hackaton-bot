# Production-shaped stack. Local conveniences (hot reload, exposed Postgres
# port, unsigned auth) live in docker-compose.override.yml, which Compose
# loads automatically — delete or ignore that file when deploying for real.

services:
  db:
    image: postgres:16-alpine
    container_name: hackaton_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackaton_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hackaton_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackaton_fastapi
    restart: unless-stopped
    # Migrations are the schema source of truth: apply them before serving.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackaton_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackaton_db}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: hackaton_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_BASE_URL=http://web:8000/api/v1
    # The bot fetches its keyboards from /options/ on startup, so it needs the
    # API to actually be answering — not merely started.
    depends_on:
      web:
        condition: service_healthy

  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    container_name: hackaton_miniapp
    restart: unless-stopped
    ports:
      - "${MINIAPP_PORT:-8080}:80"
    # nginx proxies /api to the backend, so the mini-app calls its own origin
    # and there is no CORS or mixed-content problem to solve in the browser.
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
